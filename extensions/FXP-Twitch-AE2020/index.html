<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FXP Twitch</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><b>TWITCH</b><span>FXP • AE 2020</span></header><main>
  <section class="master"><label>Amount <input id="amount" type="number" value="35"></label><label>Speed <input id="speed" type="number" value="25"></label></section>
  <details open><summary>Enable</summary><div class="checks"><label><input id="blurOn" type="checkbox" checked> Blur</label><label><input id="colorOn" type="checkbox" checked> Color</label><label><input id="lightOn" type="checkbox" checked> Light</label><label><input id="scaleOn" type="checkbox"> Scale</label><label><input id="slideOn" type="checkbox" checked> Slide</label><label><input id="timeOn" type="checkbox"> Time</label></div></details>
  <details><summary>Behaviour</summary><label>Burst Chance % <input id="chance" type="number" value="35"></label><label>Random Seed <input id="seed" type="number" value="0"></label></details>
  <details open><summary>Operator Controls</summary>
    <details><summary>Blur</summary><label>Blur Amount <input id="blurAmount" type="number" value="50"></label><label>Blur Twitches [sec] <input id="blurRate" type="number" step="0.1" value="1"></label><label>Blur Boost <input type="number" value="100"></label><label>Blur Opacity <input type="number" value="100"></label></details>
    <details><summary>Color</summary><label>Color Amount <input id="colorAmount" type="number" value="70"></label><label>Color Twitches [sec] <input id="colorRate" type="number" step="0.1" value="2.7"></label><label>Colorize <input id="colorize" type="color" value="#ff0000"></label><label>Color Randomize <input type="number" value="0"></label></details>
    <details><summary>Light</summary><label>Light Amount <input id="lightAmount" type="number" value="50"></label><label>Light Twitches [sec] <input id="lightRate" type="number" step="0.1" value="1"></label><label>Light Behaviour <select id="lightMode"><option>Brighter</option><option>Darker</option><option>Both</option></select></label></details>
    <details><summary>Scale</summary><label>Scale Amount <input id="scaleAmount" type="number" value="8"></label><label>Scale Twitches [sec] <input id="scaleRate" type="number" step="0.1" value="1"></label></details>
    <details><summary>Slide</summary><label>Slide Amount <input id="slideAmount" type="number" value="50"></label><label>Slide Twitches [sec] <input id="slideRate" type="number" step="0.1" value="1"></label><label>Slide Direction <input id="slideDirection" type="number" value="0"></label><label>Slide Spread <input type="number" step="0.1" value="1"></label><label>Slide Tendency <input type="number" value="0"></label><label>Slide RGB Split <input type="number" value="0"></label><label>Slide Motion Blur <input type="number" value="100"></label></details>
    <details><summary>Time</summary><label>Time Amount <input type="number" value="50"></label><label>Time Twitches [sec] <input type="number" step="0.1" value="1"></label></details>
  </details>
  <button id="apply">Apply / Update</button><button id="reset" class="secondary">Reset reference values</button><div id="status">Prêt.</div>
</main><script src="js/bridge.js"></script><script src="js/main.js"></script></body></html>
